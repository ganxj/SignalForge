# config/config.yaml

# Target communities
subreddits:
  primary:
    # Tech, developer, SaaS, and infrastructure communities
    - selfhosted
    - devops
    - saas
    - programming
    - learnprogramming
    - webdev
    - softwareengineering
    - sysadmin
    - cybersecurity
    - homelab
    - DataHoarder
    - artificial
    - MachineLearning
    # Business, finance, career, and product communities
    - entrepreneur
    - startups
    - smallbusiness
    - marketing
    - productivity
    - careeradvice
    - jobs
    - cscareerquestions
    - personalfinance
    - investing
    - stocks
    - CryptoCurrency
    # Broad mainstream communities
    - AskReddit
    - NoStupidQuestions
    - todayilearned
    - explainlikeimfive
    - LifeProTips
    - IAmA
    - worldnews
    - news
    - science
    - technology
    - Futurology
    - dataisbeautiful
    - books
    - movies
    - television
    - Music
    - gaming
    - pcgaming
    - Games
    - aww
    - pics
    - funny
    - mildlyinteresting
    - interestingasfuck
    - Damnthatsinteresting
    - travel
    - food
    - fitness
    - GetMotivated
  exploratory_limit: 12             # Max exploratory subreddits at a time
  exploratory_refresh_days: 7       # How often to refresh improvised list
  exploratory_percentage: 90        # % of posts from exploratory communities
  primary_percentage: 10            # % of posts from configured communities

# Reddit scraping settings
reddit:
  mode: browser                     # "public_json", "html", "browser", or "api"
  scheduled_crawl_enabled: true     # Run automatic crawls at minute 0 of every hour while the Streamlit app is open

ui:
  default_language: zh              # "zh" or "en"

scraper:
  min_post_age_days: 0              # Include fresh posts/comments
  max_post_age_days: 14             # Keep first formal crawl small and recent
  max_items_per_day: 60             # Total target item budget per run
  include_comments: true
  rate_limit_per_minute: 12         # Conservative public JSON crawling

# Public JSON scraper safety controls
public_scraper:
  max_requests_per_run: 180
  max_rate_limit_hits: 2
  polite_delay_seconds: 3
  backoff_base_seconds: 90
  backoff_max_seconds: 900
  cache_ttl_hours: 1
  cache_dir: data/cache/reddit_json
  max_comments_per_post: 8
  max_items_to_analyze: 12
  browser_page_timeout_seconds: 25
  browser_settle_milliseconds: 1200
  browser_crawl_timeout_minutes: 25
  comment_sort: confidence
  min_posts_per_subreddit: 2
  sorts:
    - hot
    - top
    - new
  top_time_filter: week

# AI provider settings
ai:
  provider: openai               # "openai" or "anthropic"
  scheduled_analysis_enabled: true  # Run automatic AI analysis at minute 30 of every hour while the Streamlit app is open
  openai:
    model_filter: deepseek-3.2        # For pre-filtering stage
    model_deep: deepseek-3.2             # For insight extraction
    enqueued_token_limits:           # Max enqueued tokens per model (OpenAI tier limits)
      deepseek-3.2: 900_000
    default_enqueued_token_limit: 5_000_000
  anthropic:
    model_filter: claude-haiku-4-5-20251001
    model_deep: claude-sonnet-4-5-20250929
    default_enqueued_token_limit: 10_000_000
  use_batch_api: true
  monthly_budget_usd: 100           # Cost cap for safety
  max_tokens_per_post: 1000         # Estimate for budgeting
  cache_input: true                 # Reuse prompt if post is nearly identical

# Scoring weights (used in filtering and final ranking)
scoring:
  relevance_weight: 0.25
  emotion_weight: 0.1
  pain_point_weight: 0.2
  implementability_weight: 0.15
  technical_depth_weight: 0.2       # Penalize vibe-codeable ideas, reward real engineering
  recent_activity_weight: 0.1       # Prioritize active threads
  min_technical_depth: 4            # Hard filter: reject posts below this technical depth score
  analysis_threshold: 7.0           # Scheduled AI analysis weighted-score threshold
  output_top_n: 10                  # Number of final posts to recommend

# Database settings
database:
  path: data/db.sqlite
  retention_days: 90                # Auto-remove posts older than this

# Logging & output
log_level: DEBUG                   # For debug & reuse
save_batch_payloads: true           # For debug & reuse

cleanup:
  batch_response_retention_days: 3 # Cleanup batch responses older than this
